<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="55%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <linearGradient id="bgSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d4f4e6"/>
    </linearGradient>

    <linearGradient id="shieldEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>

    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <filter id="innerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#022c22" flood-opacity="0.45"/>
    </filter>

    <radialGradient id="glow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6ee7b7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- rounded square backdrop -->
  <rect x="4" y="4" width="192" height="192" rx="46" fill="url(#bgGrad)"/>
  <rect x="4" y="4" width="192" height="192" rx="46" fill="url(#glow)"/>
  <rect x="4" y="4" width="192" height="96" rx="46" fill="url(#bgSheen)"/>

  <!-- shield, layered for depth: dark edge behind, offset slightly down-right -->
  <g filter="url(#softShadow)">
    <path d="M100 34L156 56V116C156 148 132 168 100 178C68 168 44 148 44 116V56L100 34Z"
          fill="url(#shieldEdge)"/>
  </g>

  <!-- shield front face, offset up-left for a raised 3D look -->
  <path d="M100 28L154 49V109C154 141 130 161 100 171C70 161 46 141 46 109V49L100 28Z"
        fill="url(#shieldGrad)" filter="url(#innerGlow)"/>

  <!-- subtle top gloss on shield -->
  <path d="M100 28L154 49V72C136 60 118 52 100 52C82 52 64 60 46 72V49L100 28Z"
        fill="#ffffff" opacity="0.35"/>

  <!-- checkmark, slightly raised with its own shadow -->
  <path d="M76 100L92 116L126 82" fill="none" stroke="#022c22" stroke-width="12"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.25" transform="translate(0,4)"/>
  <path d="M76 100L92 116L126 82" fill="none" stroke="url(#checkGrad)" stroke-width="11"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
